name: Build Blockera Site Toolkit Tests

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
    pr-workflow-gate:
        name: PR workflow filter
        runs-on: ubuntu-latest
        outputs:
            run: ${{ steps.gate.outputs.run }}
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - id: gate
              uses: ./packages/global-packages/packages/dev-tools/github/actions/pr-workflow-gate
              with:
                  workflow-file: build-plugin-zip-tests.yml

    build_tests:
        name: Building and Run E2E Tests (PHP ${{ matrix.php }})
        needs: pr-workflow-gate
        if: ${{ needs.pr-workflow-gate.outputs.run == 'true' && (github.repository == 'blockeraai/blockera-site-toolkit' || github.event_name == 'pull_request') }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: true
            matrix:
                php: ['7.4', '8.0', '8.1', '8.2']
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
            GITHUB_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
            BLOCKERA_BUILD_ZIP_TESTS_SPECS_ROOTS: ./packages
            BLOCKERA_BUILD_ZIP_TESTS_SPECS_PATH: '*toolkit*'
            BLOCKERA_BUILD_ZIP_TESTS_SPECS_DEST: packages/site-toolkit/js/test
            BLOCKERA_BUILD_ZIP_TESTS_CYPRESS_SPEC_PATTERN: packages/**/*toolkit*.build.e2e.cy.js,packages/site-toolkit/**/*.build.e2e.cy.js
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - uses: ./packages/global-packages/packages/dev-tools/github/actions/build-plugin-zip-tests
              with:
                  php-version: ${{ matrix.php }}
                  skip-if-no-specs: 'true'
                  zip-file: blockera-site-toolkit.zip
                  build-dir: ./build/blockera-site-toolkit
